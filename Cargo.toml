[workspace]
resolver = "3"
members = [
  "crates/agentic-pipeline",
  "crates/entities",
  "crates/http",
  "crates/migration",
  "crates/ml-processing",
  "crates/yt-processing",
]

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = [
  "json",
  "macros",
  "tokio",
  "tracing",
  "ws",
] }
axum-extra = { version = "0.12.0", features = ["cookie", "typed-header"] }
axum-macros = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
# Entities crate
entities = { path = "crates/entities" }
gemini-rust = "1.5.1"
http-body-util = "0.1"
jsonwebtoken = "9.3"
ml-processing = { path = "crates/ml-processing" }
oauth2 = "*"
password-hash = "0.5.0"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
rig = { version = "0.46.0" }
schemars = "*"
sea-orm = { version = "2.0.0-rc", features = [
  "debug-print",
  "macros",
  "mock",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-json",
  "with-uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.17"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"  ## For websocket support
toon-format = "0.4"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "env-filter",
  "fmt",
] }
user-agent-parser = "*"
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4"] }
vtt = "1.0.0"
yt-processing = { path = "crates/yt-processing" }
